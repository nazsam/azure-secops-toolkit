id: 64db0e3f-6225-4b0f-8611-12c80088f445
name: Entra ID password spray from a single IP
description: |
  One IP address failed sign-in for many different accounts in a short window, the classic
  password spray pattern. Tune the user threshold to your tenant size.
severity: Medium
kind: Scheduled
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes: [SigninLogs]
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: [CredentialAccess]
relevantTechniques: [T1110.003]
query: |
  let min_users = 10;
  SigninLogs
  | where ResultType in ("50126", "50053", "50055", "50056")
  | summarize
      FailedUsers = dcount(UserPrincipalName),
      Attempts = count(),
      SampleUsers = make_set(UserPrincipalName, 25),
      Apps = make_set(AppDisplayName, 10),
      FirstSeen = min(TimeGenerated),
      LastSeen = max(TimeGenerated)
      by IPAddress, Location = tostring(LocationDetails.countryOrRegion)
  | where FailedUsers >= min_users
  | order by FailedUsers desc
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
version: 1.0.0
