id: a5ee2f51-4bc6-4d90-8b99-41c807f5530c
name: Key Vault mass secret retrieval
description: |
  One identity read an unusually large number of distinct secrets from Key Vault in an hour.
  Requires Key Vault diagnostic logs (AuditEvent) sent to the Sentinel workspace.
severity: High
kind: Scheduled
requiredDataConnectors:
  - connectorId: AzureKeyVault
    dataTypes: [AzureDiagnostics]
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: [CredentialAccess]
relevantTechniques: [T1555.006]
query: |
  let min_secrets = 20;
  AzureDiagnostics
  | where ResourceProvider == "MICROSOFT.KEYVAULT" and OperationName == "SecretGet"
  | where ResultType == "Success"
  | extend Caller = coalesce(identity_claim_http_schemas_xmlsoap_org_ws_2005_05_identity_claims_upn_s, identity_claim_appid_g)
  | summarize DistinctSecrets = dcount(id_s), Reads = count(), Vaults = make_set(Resource, 10)
      by Caller, CallerIPAddress, bin(TimeGenerated, 1h)
  | where DistinctSecrets >= min_secrets
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Caller
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: CallerIPAddress
version: 1.0.0
