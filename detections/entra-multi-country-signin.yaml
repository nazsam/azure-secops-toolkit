id: fb38e632-aca5-453b-b5e3-d9550e8c0cb9
name: Successful sign-ins from multiple countries within one hour
description: |
  The same account signed in successfully from two or more countries inside one hour.
  Often a stolen session or credential; sometimes VPN use, so check the IPs.
severity: Medium
kind: Scheduled
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes: [SigninLogs]
queryFrequency: 1h
queryPeriod: 2h
triggerOperator: gt
triggerThreshold: 0
tactics: [InitialAccess, DefenseEvasion]
relevantTechniques: [T1078.004]
query: |
  SigninLogs
  | where ResultType == "0"
  | extend Country = tostring(LocationDetails.countryOrRegion)
  | where isnotempty(Country)
  | summarize
      Countries = make_set(Country),
      CountryCount = dcount(Country),
      IPs = make_set(IPAddress, 10),
      Apps = make_set(AppDisplayName, 10)
      by UserPrincipalName, bin(TimeGenerated, 1h)
  | where CountryCount >= 2
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: UserPrincipalName
version: 1.0.0
