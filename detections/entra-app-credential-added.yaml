id: 3cc78b6d-350d-411c-a1a4-7ec861ef2acc
name: New credential added to an application or service principal
description: |
  A secret or certificate was added to an app registration or service principal. Adding
  credentials to an existing, trusted app is a common cloud persistence technique.
severity: Medium
kind: Scheduled
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes: [AuditLogs]
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: [Persistence, PrivilegeEscalation]
relevantTechniques: [T1098.001]
query: |
  AuditLogs
  | where OperationName has_any ("Add service principal credentials", "Certificates and secrets management")
  | where Result == "success"
  | extend
      AppName = tostring(TargetResources[0].displayName),
      AppId = tostring(TargetResources[0].id),
      Actor = coalesce(tostring(InitiatedBy.user.userPrincipalName), tostring(InitiatedBy.app.displayName)),
      ActorIP = tostring(InitiatedBy.user.ipAddress)
  | project TimeGenerated, OperationName, AppName, AppId, Actor, ActorIP, CorrelationId
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Actor
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: ActorIP
version: 1.0.0
