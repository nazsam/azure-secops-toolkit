id: d019b719-180b-49a1-8306-36afcfd10971
name: LSASS memory dump attempt
description: |
  A process tried to dump LSASS memory using comsvcs.dll MiniDump or ProcDump. This is how
  attackers steal credentials from a compromised host. Isolate the device and investigate.
severity: High
kind: Scheduled
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes: [DeviceProcessEvents]
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: [CredentialAccess]
relevantTechniques: [T1003.001]
query: |
  DeviceProcessEvents
  | where (ProcessCommandLine has "comsvcs" and ProcessCommandLine has_any ("MiniDump", "#24"))
      or (FileName in~ ("procdump.exe", "procdump64.exe") and ProcessCommandLine has "lsass")
  | project TimeGenerated, DeviceName, DeviceId, AccountName, FileName, ProcessCommandLine,
      InitiatingProcessFileName, InitiatingProcessCommandLine
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
version: 1.0.0
