[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "azure-secops-toolkit"
version = "1.0.0"
description = "Detection-as-code, SOAR playbooks and triage tooling for Microsoft Sentinel, Defender XDR and Defender for Cloud"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sam Naz" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
secops = "secops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
